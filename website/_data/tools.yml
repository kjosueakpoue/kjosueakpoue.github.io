# ------------------------------------------------------------
# LANGAGES DOCUMENTAIRES
# ------------------------------------------------------------

- id: wriml
  type: language
  status: active
  name: "WRIML"
  fullname:
    en: "WRIML — Writing & Research Information Markup Language"
    fr: "WRIML — Writing & Research Information Markup Language"
  description:
    en: "A documentary markup language designed for scientific writing and research documentation. WRIML provides a structured, extensible framework for encoding linguistic and scholarly documents."
    fr: "Un langage de balisage documentaire conçu pour la rédaction scientifique et la documentation de recherche. WRIML fournit un cadre structuré et extensible pour l'encodage de documents linguistiques et savants."
  url_site: "https://dbjoshua.github.io/WRIML"
  url_github: "https://github.com/wriml"
  version_current: "3.0"

