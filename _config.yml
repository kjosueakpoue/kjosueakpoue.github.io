# ============================================================
# _config.yml — Configuration Jekyll
# Akpoué Kouamé Josué — Site académique
# ============================================================

title: "Akpoué Kouamé Josué"
description: "Linguist & Developer — Formal semantics, Ivorian languages, computational tools"
author: "Akpoué Kouamé Josué"
email: "josueakpoue@gmail.com"
url: "https://kjosueakpoue.github.io"
baseurl: ""

# Langues
languages: ["en", "fr"]
default_lang: "en"

# Jekyll
markdown: kramdown
highlighter: rouge
permalink: /:path/:basename:output_ext

# Exclusions
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules

# Collections (pour plus tard : billets, notes)
collections:
  posts:
    output: false

# Plugins GitHub Pages compatibles
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
