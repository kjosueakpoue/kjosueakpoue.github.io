# ------------------------------------------------------------
# DSL — NOTATION FORMELLE
# ------------------------------------------------------------

- id: wrasci
  type: dsl
  status: beta
  name: "WRASCI"
  fullname:
    en: "WRASCI — Writing ASCII IPA Encoding Standard"
    fr: "WRASCI — Norme d'encodage ASCII pour l'Alphabet Phonétique International"
  description:
    en: >
      WRASCI (WRiting ASCii Ipa) is a deterministic ASCII encoding standard for the
      International Phonetic Alphabet (IPA). Designed for plain-text linguistic
      data representation and typesetting pipelines, it maps phonetic symbols using
      systematic geometric suffix rules (e.g., character inversions, reversals, and
      diacritic modifiers), enabling unambiguous IPA input on standard keyboards
      without special software tools.
    fr: >
      WRASCI (WRiting ASCii Ipa) est une norme d'encodage ASCII déterministe pour
      l'Alphabet Phonétique International (API). Conçue pour la représentation de
      données linguistiques en texte brut et les chaînes de traitement éditoriales,
      elle associe les symboles phonétiques au moyen de règles de suffixation
      géométriques systématiques (inversions, renversements, diacritiques), permettant
      une saisie non ambiguë de l'API sur tout clavier standard.
  version_current: "0.2.0"
  url_site: ""
  url_github: "https://github.com/wriml/wrasci/releases/tag/v1.0.0"
  related: "wriml"

- id: phi
  type: dsl
  status: in-development
  name: "φ (phi)"
  fullname:
    en: "φ — Notation interface for formal linguistics"
    fr: "φ — Interface de notation pour la linguistique formelle"
  description:
    en: >
      A lightweight notation syntax for formal semantics. Write logical
      formulas, lambda expressions, semantic types, and denotations without
      memorizing dozens of LaTeX commands. The specification (v0.2.0) and
      formal EBNF grammar are stable, but backends are not yet released —
      φ is currently usable for quick notes but not yet ready for editorial
      or publication workflows.
    fr: >
      Une syntaxe de notation légère pour la sémantique formelle. Écrivez
      des formules logiques, des expressions lambda, des types sémantiques
      et des dénotations sans mémoriser des dizaines de commandes LaTeX.
      La spécification (v0.2.0) et la grammaire EBNF formelle sont stables,
      mais les backends ne sont pas encore publiés — φ est utilisable pour
      des notes rapides mais pas encore prêt pour les flux d'édition et
      de publication.
  version_current: "0.2.0"
  url_site:
  url_github: "https://github.com/phi-project/phi"
  related: "math4lin"        # paquet LaTeX de support officiel

# ------------------------------------------------------------
# PACKAGES LATEX
# ------------------------------------------------------------

- id: cssyntax
  type: package
  status: stable
  name: "cssyntax"
  platform: "LaTeX"
  fullname:
    en: "cssyntax — Normalization and Readability for Internal TeX/LaTeX Control Sequences"
    fr: "cssyntax — Normalisation et lisibilité des séquences de contrôle internes TeX/LaTeX"
  description:
    en: >
      The cssyntax package introduces a unified syntax layer for LaTeX package
      development, designed to structure and clarify the naming of internal commands.
      By temporarily extending the scope of the _, :, and / characters, it enables
      authors to formalize control sequences using an explicit hierarchical convention
      (container_module_type_subtype/description). cssyntax provides a set of high-level,
      self-documenting aliases for core TeX and LaTeX2e primitives, offering developers
      a modern, readable, and domain-agnostic foundation for writing robust TeX code.
    fr: >
      Le paquet cssyntax introduit une couche syntaxique unifiée pour le développement
      de paquets LaTeX, pensée pour structurer et clarifier le nommage des commandes
      internes. En étendant temporairement la portée des caractères _, : et /, il permet
      de formaliser les séquences de contrôle selon une convention hiérarchique explicite
      (conteneur_module_type_sous-type/description). cssyntax fournit un jeu d'alias
      haut niveau et auto-documentés pour les primitives TeX et LaTeX2e fondamentales,
      offrant ainsi aux auteurs un socle moderne, lisible et agnostique pour l'écriture
      de code TeX robuste.
  support_for: 
  url_github: "https://github.com/dbjoshua/cssyntax/releases/tag/v0.1.2"
  url_ctan: 
  version_current: "0.1.0"

- id: math4lin
  type: package
  status: in-development
  name: "math4lin"
  platform: "LaTeX"
  fullname:
    en: "math4lin — Official LaTeX support package for φ"
    fr: "math4lin — Paquet LaTeX de support officiel de φ"
  description:
    en: >
      The official LaTeX backend for φ. Compiles φ notation to LaTeX
      commands via expl3 pattern matching. Intended for drop-in integration
      into existing LaTeX workflows. Not yet released — development in
      progress alongside the φ specification.
    fr: >
      Le backend LaTeX officiel de φ. Compile la notation φ en commandes
      LaTeX via pattern matching expl3. Conçu pour une intégration
      transparente dans les flux LaTeX existants. Pas encore publié —
      développement en cours parallèlement à la spécification φ.
  support_for: "phi"         # supporte le DSL φ
  url_github: "https://github.com/phi-project/phi"
  url_ctan:
  version_current:

- id: xsipa
  type: package
  status: stable
  name: "xsipa"
  platform: "LaTeX"
  fullname:
    en: "xsipa — XSAMPA shortcuts for phonetic transcription"
    fr: "xsipa — Raccourcis XSAMPA pour la transcription phonétique"
  description:
    en: "A LaTeX package providing shorthand commands for phonetic transcription, based on XSAMPA notation. Reduces verbosity of tipa-style commands for IPA transcription in linguistic documents."
    fr: "Un package LaTeX fournissant des commandes abrégées pour la transcription phonétique, basé sur la notation XSAMPA. Réduit la verbosité des commandes de style tipa pour la transcription API dans les documents linguistiques."
  url_github: "https://github.com/dbjoshua/linguists-tex"
  url_ctan:
  version_current:
  related: "lipa"            # successeur conceptuel : lipa

- id: lipa
  type: package
  status: in-development
  name: "lipa"
  platform: "LaTeX"
  fullname:
    en: "lipa — Unicode IPA to LaTeX translation layer"
    fr: "lipa — Couche de traduction Unicode API vers LaTeX"
  description:
    en: >
      A LaTeX package that translates Unicode IPA input to tipa commands
      on-the-fly. Rather than shortening transcription commands (as xsipa
      does), lipa acts as a transparent translation layer: type directly
      in Unicode IPA, get tipa output. More ambitious than xsipa —
      currently in development.
    fr: >
      Un package LaTeX qui traduit la saisie Unicode API en commandes tipa
      à la volée. Plutôt que de raccourcir les commandes de transcription
      (comme xsipa), lipa agit comme une couche de traduction transparente :
      saisissez directement en Unicode API, obtenez une sortie tipa. Plus
      ambitieux que xsipa — actuellement en développement.
  url_github:
  url_ctan:
  version_current:

- id: interlinear
