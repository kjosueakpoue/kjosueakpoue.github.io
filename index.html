<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akpoué Kouamé Josué</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Fond plein écran canard ── */
    html, body {
      width: 100%; height: 100%;
      background-color: #0C857A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      font-family: 'Fira Sans', sans-serif;
    }

    /* ── Logo ── */
    .splash-logo {
      width: min(320px, 70vw);
      height: auto;
    }

    /* ── Texte bienvenue ── */
    .splash-text {
      color: #FFFFF7;
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      letter-spacing: 0.12em;
      text-align: center;
      opacity: 0;
      animation: fadein 600ms ease forwards 1800ms;
    }

    /* ── Branches : légèrement visibles par défaut ── */
    #branch1, #branch2, #branch3, #branch4 {
      opacity: 0.07;
    }

    /* ── Animation branche : fondu entrant ── */
    @keyframes branch-in {
      from { opacity: 0.07; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Animation texte ── */
    @keyframes fadein {
      from { opacity: 0; }
      to   { opacity: 0.75; }
    }

    /* ── Cascade des 4 branches ── */
    #branch1 { animation: branch-in 450ms cubic-bezier(0.4,0,0.2,1) forwards 200ms; }
    #branch2 { animation: branch-in 450ms cubic-bezier(0.4,0,0.2,1) forwards 550ms; }
    #branch3 { animation: branch-in 450ms cubic-bezier(0.4,0,0.2,1) forwards 900ms; }
    #branch4 { animation: branch-in 450ms cubic-bezier(0.4,0,0.2,1) forwards 1250ms; }
  </style>
</head>
<body>

  <!-- Logo SVG inline — branches animées individuellement -->
  <svg
    class="splash-logo"
    viewBox="0 0 400 400"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="Logo Akpoué Kouamé Josué"
    role="img">

    <g id="logo" transform="translate(-2920.3177,467.61917)">

      <g transform="matrix(0.57142857,0,0,0.57142857,2610.7325,-1433.3986)"
         id="branch1">
        <path
          d="m 756.378,1717.306 c 41.657,-17.512 87.405,-27.192 135.396,-27.192
             0,193.17 -156.83,350 -350,350 0,-47.991 9.68,-93.739 27.192,-135.396
             97.656,-12.272 175.141,-89.756 187.412,-187.412 z"
          fill="#FFFFF7" />
      </g>

      <g transform="matrix(0.57142857,0,0,0.57142857,2610.7325,-1433.3986)"
         id="branch2">
        <path
          d="m 1214.582,1904.718 c 17.512,41.657 27.192,87.405 27.192,135.396
             -193.17,0 -350,-156.83 -350,-350 47.991,0 93.739,9.68 135.396,27.192
             12.272,97.656 89.756,175.14 187.412,187.412 z"
          fill="#FFFFF7" />
      </g>

      <g transform="matrix(0.57142857,0,0,0.57142857,2610.7325,-1433.3986)"
         id="branch3">
        <path
          d="m 1027.17,2362.922 c -41.657,17.512 -87.405,27.192 -135.396,27.192
             0,-193.17 156.83,-350 350,-350 0,47.991 -9.68,93.739 -27.192,135.396
             -97.656,12.271 -175.14,89.756 -187.412,187.412 z"
          fill="#FFFFF7" />
      </g>

      <g transform="matrix(0.57142857,0,0,0.57142857,2610.7325,-1433.3986)"
         id="branch4">
        <path
          d="m 568.966,2175.51 c -17.512,-41.657 -27.192,-87.405 -27.192,-135.396
             193.17,0 350,156.83 350,350 -47.991,0 -93.739,-9.68 -135.396,-27.192
             -12.271,-97.656 -89.756,-175.141 -187.412,-187.412 z"
          fill="#FFFFF7" />
      </g>

    </g>
  </svg>

  <!-- Texte discret — apparaît après les branches -->
  <p class="splash-text">Akpoué Kouamé Josué &nbsp;·&nbsp; Bienvenue &nbsp;·&nbsp; Welcome</p>

  <!-- Redirection après la fin de l'animation -->
  <script>
    // Durée totale : dernière branche (1250ms) + animation (450ms) + texte (600ms+1800ms) + pause = ~3200ms
    setTimeout(() => {
      window.location.href = 'en/';
    }, 3400);
  </script>

</body>
</html>
