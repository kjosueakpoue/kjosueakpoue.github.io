<!-- ============================================================
     HEAD.HTML — Métadonnées et ressources communes
     Inclus dans _layouts/default.html
     ============================================================ -->

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0C857A" />

<!-- SEO -->
<title>
  {% if page.title %}
    {{ page.title }} — {{ site.title }}
  {% else %}
    {{ site.title }} — {{ site.description }}
  {% endif %}
</title>
<meta name="description"
  content="{{ page.description | default: site.description }}" />
<meta name="author" content="{{ site.author }}" />

<!-- Open Graph — aperçu sur réseaux sociaux -->
<meta property="og:type"        content="website" />
<meta property="og:title"
  content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}" />
<meta property="og:description"
  content="{{ page.description | default: site.description }}" />
<meta property="og:url"
  content="{{ site.url }}{{ page.url }}" />

<!-- Langue courante -->
<meta property="og:locale"
  content="{% if page.lang == 'fr' %}fr_FR{% else %}en_US{% endif %}" />

<!-- Lien vers la version alternative (EN ↔ FR) -->
{% if page.lang == 'fr' %}
  <link rel="alternate" hreflang="en"
    href="{{ site.url }}/en/{% if page.alt_url %}{{ page.alt_url }}{% endif %}" />
{% else %}
  <link rel="alternate" hreflang="fr"
    href="{{ site.url }}/fr/{% if page.alt_url %}{{ page.alt_url }}{% endif %}" />
{% endif %}

<link rel="canonical" href="{{ site.url }}{{ page.url }}" />

<!-- ============================================================
     POLICES — Google Fonts
     Chargement optimisé : preconnect avant le lien CSS
     Polices chargées :
       Fira Sans  : 300, 300i, 400, 400i, 500, 600
       Fira Code  : 400, 500
       EB Garamond: 400, 400i — pour @media print uniquement
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Fira+Code:wght@400;500&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
  rel="stylesheet" />

<!-- ============================================================
     FEUILLES DE STYLE
     Ordre important : variables en premier,
     composants ensuite.
     ============================================================ -->
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/variables.css" />
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/nav-hero.css" />
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/layout.css" />

<!-- CSS spécifique à la page courante (optionnel)
     Pour charger un CSS additionnel sur une page précise,
     ajouter dans le front matter :
       css:
         - home.css
         - publications.css
-->
{% if page.css %}
  {% for stylesheet in page.css %}
    <link rel="stylesheet"
      href="{{ site.baseurl }}/assets/css/{{ stylesheet }}" />
  {% endfor %}
{% endif %}

<!-- Favicon — monogramme AJ -->
<link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/assets/img/favicon.svg" />
