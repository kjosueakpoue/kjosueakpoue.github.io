---
layout: default
---
<!-- ============================================================
     LAYOUT PAGE — pages internes
     Utilisé par : research, publications, tools,
                   collaborate, fieldwork
     Structure : en-tête de page + contenu
     ============================================================ -->

<div class="page-header">
  <div class="container">
    {% if page.label %}
      <p class="label">{{ page.label }}</p>
    {% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </div>
</div>

<div class="page-content">
  <div class="container">
    {{ content }}
  </div>
</div>
